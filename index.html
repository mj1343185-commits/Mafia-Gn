<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tennis Mafia</title>
<meta name="theme-color" content="#0a0a0a">
<style>
:root{--bg:#050505;--card:#14110a;--gold:#f2b705;--text:#e9e6dc;--muted:#8d8a80;--red:#d8141b}
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%}
body{background:var(--bg);color:var(--text);font-family:Poppins,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;align-items:center;padding:20px;padding-top:max(20px,env(safe-area-inset-top));padding-bottom:max(20px,env(safe-area-inset-bottom));overflow-x:hidden;position:relative}
body::before,body::after{content:"";position:fixed;width:60vmax;height:60vmax;border-radius:50%;filter:blur(90px);opacity:.18;z-index:0;animation:drift 14s ease-in-out infinite alternate}
body::before{background:var(--red);top:-30vmax;left:-20vmax}
body::after{background:var(--gold);bottom:-35vmax;right:-25vmax;animation-delay:-7s}
@keyframes drift{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.card{position:relative;z-index:1;width:100%;max-width:460px;background:linear-gradient(180deg,#17130a,#0e0c07);border:1px solid rgba(242,183,5,.35);border-radius:34px;padding:38px 24px 30px;text-align:center;box-shadow:0 0 0 1px rgba(0,0,0,.6),0 30px 80px rgba(0,0,0,.7),0 0 60px rgba(242,183,5,.08);animation:enter .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes enter{from{opacity:0;transform:translateY(30px) scale(.97)}to{opacity:1;transform:none}}
.logo-wrap{position:relative;width:170px;height:170px;margin:0 auto 26px}
.logo-wrap::before{content:"";position:absolute;inset:-8px;border-radius:50%;background:conic-gradient(from 0deg,var(--gold),transparent 30%,var(--red),transparent 65%,var(--gold));animation:spin 6s linear infinite;-webkit-mask:radial-gradient(circle,transparent 66%,#000 68%);mask:radial-gradient(circle,transparent 66%,#000 68%)}
@keyframes spin{to{transform:rotate(360deg)}}
.logo{position:relative;width:100%;height:100%;border-radius:50%;object-fit:cover;border:3px solid #0a0a0a;animation:float 4s ease-in-out infinite;box-shadow:0 10px 40px rgba(216,20,27,.35)}
@keyframes float{50%{transform:translateY(-6px)}}
h1{font-size:clamp(2.3rem,10vw,3rem);line-height:1.1;font-weight:800;color:var(--gold);letter-spacing:-.5px;background:linear-gradient(100deg,#d99c00 20%,#ffe27a 45%,#d99c00 70%);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;animation:shine 4s linear infinite}
@keyframes shine{from{background-position:120% 0}to{background-position:-120% 0}}
.tag{margin-top:14px;font-size:1.02rem;color:#a9a69b;letter-spacing:.5px}
.divider{width:84px;height:3px;border-radius:3px;background:#4a473f;margin:22px auto;position:relative;overflow:hidden}
.divider::after{content:"";position:absolute;inset:0;width:40%;background:var(--gold);animation:slide 2.2s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.timer{display:flex;align-items:center;justify-content:center;gap:10px;font-size:1.05rem;color:#cfccc1;margin-bottom:22px}
.timer b{font-size:1.7rem;color:#fff;min-width:2ch;display:inline-block;font-variant-numeric:tabular-nums;transition:transform .2s}
.timer b.tick{transform:scale(1.18);color:var(--gold)}
.hg{display:inline-block;animation:flip 2s ease-in-out infinite}
@keyframes flip{0%,40%{transform:rotate(0)}70%,100%{transform:rotate(180deg)}}
.info{background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.1);border-radius:20px;padding:22px 18px;font-size:1.05rem;line-height:1.75;color:#d6d3c8}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:14px;margin:30px auto 0;width:100%;max-width:370px;padding:17px 20px;background:#fff;color:#111;font-weight:700;font-size:1.2rem;letter-spacing:.3px;text-decoration:none;border:3px solid var(--gold);border-radius:18px;overflow:hidden;box-shadow:0 0 28px rgba(242,183,5,.35);transition:transform .25s,box-shadow .25s;animation:pulse 2.4s ease-in-out infinite}
.btn:hover{transform:translateY(-3px) scale(1.02);box-shadow:0 0 44px rgba(242,183,5,.6)}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid #fff;outline-offset:3px}
.btn::after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,rgba(242,183,5,.45),transparent);transform:skewX(-20deg);animation:sweep 3s ease-in-out infinite}
@keyframes sweep{0%,55%{left:-80%}100%{left:140%}}
@keyframes pulse{50%{box-shadow:0 0 44px rgba(242,183,5,.6)}}
.btn svg{width:34px;height:34px;flex:none}
.disc{margin-top:26px;font-size:.98rem;line-height:1.6;color:#77746b}
.stagger>*{animation:rise .7s cubic-bezier(.2,.8,.2,1) both}
.stagger>*:nth-child(1){animation-delay:.25s}.stagger>*:nth-child(2){animation-delay:.4s}.stagger>*:nth-child(3){animation-delay:.5s}.stagger>*:nth-child(4){animation-delay:.6s}.stagger>*:nth-child(5){animation-delay:.7s}.stagger>*:nth-child(6){animation-delay:.8s}.stagger>*:nth-child(7){animation-delay:.9s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.stagger>h1{animation:rise .7s .4s both,shine 4s linear infinite}
.stagger>.btn{animation:rise .7s .8s both,pulse 2.4s 1.5s ease-in-out infinite}
@media(max-width:380px){.card{padding:30px 16px 24px;border-radius:28px}.logo-wrap{width:140px;height:140px}.btn{font-size:1.05rem}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
